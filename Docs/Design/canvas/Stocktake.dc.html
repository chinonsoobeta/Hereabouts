<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Monthly stocktake</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&amp;family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5B3DB8;text-decoration:none}a:hover{color:#3B2A7A}
.sf{font-family:Fraunces,Georgia,serif}
.ss{font-family:'Atkinson Hyperlegible',system-ui,sans-serif}
.stamp{display:inline-block;padding:5px 9px 4px;border:1.5px solid currentColor;outline:1px solid currentColor;outline-offset:2px;border-radius:3px;font:700 11px/1 'Atkinson Hyperlegible',system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
.card{position:absolute;left:0;right:0;background:#F6F1E9;border:1.5px solid #241B3D;border-radius:8px;box-sizing:border-box;background-image:repeating-linear-gradient(to bottom,transparent 0 31px,#D9D0E6 31px 32px);background-position:0 72px}
.btn{display:flex;align-items:center;justify-content:center;height:54px;border-radius:10px;font:700 17px/1 'Atkinson Hyperlegible',system-ui,sans-serif;cursor:pointer;border:0;padding:0 12px;box-sizing:border-box;gap:8px}
.btn-p{background:#5B3DB8;color:#F6F1E9}
.btn-s{background:#F6F1E9;color:#241B3D;border:1.5px solid #241B3D}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.dot{width:10px;height:10px;border-radius:5px;border:1.5px solid #241B3D;box-sizing:border-box}
</style>
</helmet>
<div class="ss" style="width: 390px; height: 844px; box-sizing: border-box; background: #ECE5F3; color: #241B3D; display: flex; flex-direction: column; position: relative; overflow: hidden; padding: 56px 24px 40px">

  <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #655C7A">
    <span>Stocktake · October</span>
    <a href="Find.dc.html" style="min-height: 44px; display: flex; align-items: center; font-size: 15px; color: #241B3D">Later</a>
  </div>

  <h1 class="sf" style="font-size: 34px; line-height: 1.05; font-weight: 500; letter-spacing: -0.01em; margin: 24px 0 8px">Still there?</h1>
  <p style="font-size: 15px; line-height: 1.45; margin: 0; color: #655C7A">Five quick questions once a month keep the notebook honest. Nothing changes unless you say so.</p>

  <div style="display: flex; gap: 8px; align-items: center; margin-top: 18px">
    <span class="dot" style="background: #5B3DB8; border-color: #5B3DB8"></span>
    <span class="dot" style="background: #5B3DB8; border-color: #5B3DB8"></span>
    <span class="dot" style="background: #F6F1E9"></span>
    <span class="dot" style="background: #F6F1E9"></span>
    <span class="dot" style="background: #F6F1E9"></span>
    <span style="font-size: 13px; color: #655C7A; margin-left: 6px">3 of 5</span>
  </div>

  <div style="position: relative; height: 330px; margin-top: 26px">
    <div class="card" aria-hidden="true" style="top: 22px; height: 290px; transform: rotate(3deg); background-image: none"></div>
    <div class="card" aria-hidden="true" style="top: 12px; height: 290px; transform: rotate(-2deg); background-image: none"></div>
    <div class="card" style="top: 0; height: 300px; padding: 18px 20px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start">
        <span class="stamp" style="color: #9A4A14; transform: rotate(-3deg)">4 months ago</span>
        <div aria-hidden="true" style="width: 54px; height: 62px; background: #ECE5F3; border: 1px solid #D9D0E6; transform: rotate(4deg); display: flex; align-items: center; justify-content: center; font-size: 10px; color: #655C7A">photo</div>
      </div>
      <div class="sf" style="font-size: 32px; line-height: 1.05; font-weight: 500; margin-top: 14px">Spare keys</div>
      <div style="display: flex; align-items: baseline; margin-top: 12px; font-size: 16px">
        <span style="color: #655C7A">lives in</span>
        <span class="sf" style="font-size: 20px; margin-left: 8px">Kitchen</span><span style="margin: 0 6px; color: #655C7A">›</span><span class="sf" style="font-size: 20px">Top drawer</span>
      </div>
      <div style="font-size: 13px; color: #655C7A; margin-top: 14px; line-height: 1.4">Last confirmed 7 June, by you. Is it still in the drawer?</div>
    </div>
  </div>

  <div style="flex: 1"></div>

  <div style="display: flex; gap: 10px">
    <button class="btn btn-p" type="button" style="flex: 1.3"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13l5 5L20 6"></path></svg>Still there</button>
    <button class="btn btn-s" type="button" style="flex: 1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"></path></svg>Moved</button>
  </div>
  <button type="button" style="margin-top: 10px; min-height: 44px; background: transparent; border: 0; font: 400 15px/1 'Atkinson Hyperlegible',system-ui,sans-serif; color: #655C7A; cursor: pointer">Don't have it any more</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
