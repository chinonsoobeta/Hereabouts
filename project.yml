name: Localiser
options:
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    LOCALISER_CLOUD_CONTAINER: iCloud.dev.localiser.app
  configs:
    Debug:
      LOCALISER_APS_ENVIRONMENT: development
    Release:
      LOCALISER_APS_ENVIRONMENT: production
targets:
  Localiser:
    type: application
    platform: iOS
    sources: [Localiser]
    info:
      path: Localiser/Info.plist
      properties:
        LocaliserSigningTeam: $(DEVELOPMENT_TEAM)
        LocaliserCloudContainer: $(LOCALISER_CLOUD_CONTAINER)
        UIBackgroundModes: [remote-notification]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localiser.app
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Localiser
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Choose an optional photo or document to save with a belonging.
        INFOPLIST_KEY_NSCameraUsageDescription: Scan a receipt or document when you request it.
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_ENTITLEMENTS: Localiser/Localiser.entitlements
  LocaliserTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LocaliserTests]
    dependencies:
      - target: Localiser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localiser.tests
        GENERATE_INFOPLIST_FILE: YES
  LocaliserUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LocaliserUITests]
    dependencies:
      - target: Localiser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localiser.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Localiser:
    build:
      targets:
        Localiser: all
    test:
      targets: [LocaliserTests, LocaliserUITests]
      gatherCoverageData: true
      testPlans:
        - path: Localiser.xctestplan
          defaultPlan: true
    run:
      storeKitConfiguration: LocaliserTests/Localiser.storekit
