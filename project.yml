name: Localiser
options:
  developmentLanguage: en
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: BRLCAAM57K
    # Public website and support address. hereaboutsapp.com, bought 8 November.
    HEREABOUTS_SITE_URL: https://hereaboutsapp.com
    HEREABOUTS_SUPPORT_EMAIL: support@hereaboutsapp.com
    HEREABOUTS_FREE_THINGS: '15'
    # The App Group shared with the widget. The notebook moves into it on the first launch (NotebookFile).
    HEREABOUTS_APP_GROUP: group.dev.hereabouts.app
targets:
  Localiser:
    type: application
    platform: iOS
    sources: [Localiser]
    info:
      path: Localiser/Info.plist
      properties:
        # CFBundleName stays $(PRODUCT_NAME), Localiser, which is also the module name, because Xcode's generated
        # Info.plist would override it anyway. Every language names the bundle Hereabouts in InfoPlist.xcstrings,
        # and scripts/check-release.sh checks it: App Store Connect refused a build named Localiser (90129).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HereaboutsSiteURL: $(HEREABOUTS_SITE_URL)
        HereaboutsSupportEmail: $(HEREABOUTS_SUPPORT_EMAIL)
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - "AtkinsonHyperlegible-Bold.ttf"
          - "AtkinsonHyperlegible-BoldItalic.ttf"
          - "AtkinsonHyperlegible-Italic.ttf"
          - "AtkinsonHyperlegible-Regular.ttf"
          - "Fraunces-Italic[SOFT,WONK,opsz,wght].ttf"
          - "Fraunces[SOFT,WONK,opsz,wght].ttf"
        # Things the free plan holds. Builds installed straight onto a phone pass HEREABOUTS_FREE_THINGS=200.
        HereaboutsFreeThings: $(HEREABOUTS_FREE_THINGS)
        HereaboutsAppGroup: $(HEREABOUTS_APP_GROUP)
        # The app's iCloud Drive folder, which shows in Files as "Hereabouts". Automatic backups go here.
        NSUbiquitousContainers:
          iCloud.dev.hereabouts.app:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerName: Hereabouts
            NSUbiquitousContainerSupportedFolderLevels: Any
        NSUserActivityTypes: [com.apple.corespotlightitem]
        # Fixed app icon shortcuts. Each type is the link it opens; see System/AppLinks.swift.
        UIApplicationShortcutItems:
          - UIApplicationShortcutItemType: hereabouts://find
            UIApplicationShortcutItemTitle: Find something
            UIApplicationShortcutItemIconSymbolName: magnifyingglass
          - UIApplicationShortcutItemType: hereabouts://putaway
            UIApplicationShortcutItemTitle: Put something away
            UIApplicationShortcutItemIconSymbolName: tray.and.arrow.down
        # What a dragged thing travels as, so only Hereabouts takes a drop of it (ThingDrag).
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.hereabouts.app.thing
            UTTypeDescription: A Hereabouts thing
            UTTypeConformsToTypes: [public.data]
        CFBundleURLTypes:
          - CFBundleURLName: dev.hereabouts.app
            CFBundleURLSchemes: [hereabouts]
    entitlements:
      path: Localiser/Localiser.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers: [iCloud.dev.hereabouts.app]
        com.apple.developer.ubiquity-container-identifiers: [iCloud.dev.hereabouts.app]
        com.apple.developer.icloud-services: [CloudDocuments]
        com.apple.security.application-groups: [group.dev.hereabouts.app]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hereabouts.app
        TARGETED_DEVICE_FAMILY: '1,2'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hereabouts
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: You can add a photo to show what a thing looks like. Hereabouts uses only the photos you choose.
        INFOPLIST_KEY_NSCameraUsageDescription: You can take a photo of a thing or shelf, or scan a box label. Your photos stay on this device.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Use the microphone to say where you keep a thing. Hold to talk, and let go when you're done. Nothing is recorded.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '4'
        CODE_SIGN_ENTITLEMENTS: Localiser/Localiser.entitlements
    dependencies:
      - target: HereaboutsControls
      - target: HereaboutsWidget
  # Control Centre and Lock Screen buttons. No App Group: they only open the app and read nothing from the notebook.
  HereaboutsControls:
    type: app-extension
    platform: iOS
    sources:
      - HereaboutsControls
      - Localiser/System/PutAwayIntent.swift
    info:
      path: HereaboutsControls/Info.plist
      properties:
        CFBundleDisplayName: Hereabouts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hereabouts.app.controls
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '4'
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) HEREABOUTS_CONTROLS
        GENERATE_INFOPLIST_FILE: YES
  # Home screen and Lock Screen buttons (Find and Say it), and the lent-out widget. The buttons read nothing from the
  # notebook; the lent-out widget reads it read-only from the App Group.
  HereaboutsWidget:
    type: app-extension
    platform: iOS
    sources:
      - HereaboutsWidget
      - Localiser/System/WidgetButtons.swift
      - Localiser/System/LentOutRows.swift
    info:
      path: HereaboutsWidget/Info.plist
      properties:
        CFBundleDisplayName: Hereabouts
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HereaboutsAppGroup: $(HEREABOUTS_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hereabouts.app.widget
        CODE_SIGN_ENTITLEMENTS: HereaboutsWidget/HereaboutsWidget.entitlements
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '4'
        GENERATE_INFOPLIST_FILE: YES
  LocaliserTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LocaliserTests]
    dependencies:
      - target: Localiser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hereabouts.tests
        GENERATE_INFOPLIST_FILE: YES
  LocaliserUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LocaliserUITests]
    dependencies:
      - target: Localiser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.hereabouts.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Localiser:
    build:
      targets:
        Localiser: all
    test:
      targets: [LocaliserTests, LocaliserUITests]
      gatherCoverageData: true
      testPlans:
        - path: Localiser.xctestplan
          defaultPlan: true
    run:
      storeKitConfiguration: LocaliserTests/Localiser.storekit
