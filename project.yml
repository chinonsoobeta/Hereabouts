name: Localiser
options:
  deploymentTarget:
    iOS: '26.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    TARGETED_DEVICE_FAMILY: '1'
    DEVELOPMENT_TEAM: ''
    # Public website and support address. Replace once hereabouts.app (or another domain) is live.
    HEREABOUTS_SITE_URL: https://hereabouts.app
    HEREABOUTS_SUPPORT_EMAIL: support@hereabouts.app
targets:
  Localiser:
    type: application
    platform: iOS
    sources: [Localiser]
    info:
      path: Localiser/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        HereaboutsSiteURL: $(HEREABOUTS_SITE_URL)
        HereaboutsSupportEmail: $(HEREABOUTS_SUPPORT_EMAIL)
        ITSAppUsesNonExemptEncryption: false
        UIAppFonts:
          - "AtkinsonHyperlegible-Bold.ttf"
          - "AtkinsonHyperlegible-BoldItalic.ttf"
          - "AtkinsonHyperlegible-Italic.ttf"
          - "AtkinsonHyperlegible-Regular.ttf"
          - "Fraunces-Italic[SOFT,WONK,opsz,wght].ttf"
          - "Fraunces[SOFT,WONK,opsz,wght].ttf"
        # True during the 8-week Founder's launch price; shows the regular price struck through.
        HereaboutsFoundersPricing: true
        NSUserActivityTypes: [com.apple.corespotlightitem]
        CFBundleURLTypes:
          - CFBundleURLName: dev.localiser.app
            CFBundleURLSchemes: [hereabouts]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localiser.app
        TARGETED_DEVICE_FAMILY: '1'
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Hereabouts
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: Hereabouts uses photos you pick to show what a thing looks like or to read a date from a receipt. Only the photos you choose are used.
        INFOPLIST_KEY_NSCameraUsageDescription: Hereabouts uses the camera when you take a photo of a thing or scan a receipt. Photos stay on this iPhone.
        INFOPLIST_KEY_NSCalendarsWriteOnlyAccessUsageDescription: Hereabouts adds your return, warranty and expiry dates to your calendar. It never reads your existing events.
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        MARKETING_VERSION: '1.0'
        CURRENT_PROJECT_VERSION: '1'
        CODE_SIGN_ENTITLEMENTS: Localiser/Localiser.entitlements
  LocaliserTests:
    type: bundle.unit-test
    platform: iOS
    sources: [LocaliserTests]
    dependencies:
      - target: Localiser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localiser.tests
        GENERATE_INFOPLIST_FILE: YES
  LocaliserUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [LocaliserUITests]
    dependencies:
      - target: Localiser
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.localiser.uitests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Localiser:
    build:
      targets:
        Localiser: all
    test:
      targets: [LocaliserTests, LocaliserUITests]
      gatherCoverageData: true
      testPlans:
        - path: Localiser.xctestplan
          defaultPlan: true
    run:
      storeKitConfiguration: LocaliserTests/Localiser.storekit
